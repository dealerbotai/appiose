# iOS Build Workflow for EskinStore
# Generated for ios-builder (https://github.com/MobAI-App/ios-builder)
name: iOS Build

on:
  workflow_dispatch:
    inputs:
      unsigned:
        description: 'Build unsigned IPA'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          podfile-path: ios/Podfile

      - name: Install Pods
        run: cd ios && pod install

      - name: Archive & Export IPA
        run: |
          cd ios
          xcodebuild archive \
            -workspace EskinStore.xcworkspace \
            -scheme EskinStore \
            -sdk iphoneos \
            -configuration Release \
            -archivePath EskinStore.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Create ExportOptions.plist for unsigned build
          mkdir -p export
          cat > export/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingDisabled</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath EskinStore.xcarchive \
            -exportPath export \
            -exportOptionsPlist export/ExportOptions.plist

          mkdir -p ../dist
          mv export/EskinStore.ipa ../dist/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EskinStore-IPA
          path: dist/EskinStore.ipa
          if-no-files-found: error
